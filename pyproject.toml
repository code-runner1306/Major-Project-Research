[project]
name = "major-project-research"
version = "0.1.0"
description = "Controlled scalar-versus-channel-wise Gated DeltaNet experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==4.6.1",
    "matplotlib==3.10.8",
    "nvidia-ml-py==13.595.45",
    "pandas==2.3.3",
    "psutil==7.2.2",
    "pytest==9.0.2",
    "scipy==1.17.1",
    "tabulate==0.10.0",
    "tiktoken==0.12.0",
    "torch==2.11.0+cu128",
    "tqdm==4.67.1",
    "transformers==4.57.6",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
